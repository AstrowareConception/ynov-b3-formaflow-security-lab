<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FormaFlow Security Lab</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="warning">PROFIL VOLONTAIREMENT VULNÉRABLE — LABORATOIRE LOCAL UNIQUEMENT</div>
  <header><span class="badge" id="profile">profil en cours...</span><h1>Comprendre avant de corriger.</h1></header>
  <main>
    <section><h2>Connexion synthétique</h2><label for="email">Email</label><input id="email" value="alice.learner@example.test"><label for="password">Mot de passe</label><input id="password" type="password" value="Synthetic-Alice-2026!"><button id="login">Obtenir le jeton local</button></section>
    <section><h2>Catalogue PostgreSQL</h2><label for="query">Recherche</label><input id="query" value="Sécurité"><button id="search">Rechercher</button><pre id="catalog"></pre></section>
    <section class="wide"><h2>Bio contrôlée et rendu local</h2><textarea id="bio">Bio synthétique</textarea><button id="save">Enregistrer puis afficher</button><div id="bio-render"></div></section>
    <section class="wide"><h2>Trace minimale</h2><pre id="output">Aucune requête.</pre></section>
  </main>
</body>
</html>
